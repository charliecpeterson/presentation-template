project:
  type: default
  output-dir: _output

format:
  revealjs:
    theme: [default, custom.scss]
    filters:
      - roughnotation
    revealjs-plugins:
      - highlightword
      - chat-bubbles
    transition: slide
    code-overflow: wrap
    code-copy: true
    self-contained: true
    slide-number: c/t
    show-slide-number: all
    date-format: "long"
    chalkboard: false
    controls: false
    footer: "Charles Peterson"
    width: 1280
    height: 720
    center: true

execute:
  echo: true
  warning: false
  cache: false
